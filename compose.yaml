# Runs the kchat SPARQL chat agent against this website's RDF.
#
# Requires the kchat repo checked out next to this one (../kchat).
# Copy .env.example to .env and set LLM_API_KEY, then:
#   docker compose up --build
# The agent is then available at http://localhost:8000 (API at /docs).

services:
  kchat:
    build:
      context: ../kchat
    image: kchat:dev
    ports:
      - "${KCHAT_PORT:-8000}:8000"
    volumes:
      - ./server/assets:/rdf:ro
      - kchat-sessions:/data
    environment:
      LLM_MODEL: "${LLM_MODEL:-mistral/mistral-small-latest}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_CONTEXT_WINDOW_TOKENS: "${LLM_CONTEXT_WINDOW_TOKENS:-}"
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
      SYSTEM_PROMPT: "${SYSTEM_PROMPT:-}"
      AGENT_EXTRA_INSTRUCTIONS: "${AGENT_EXTRA_INSTRUCTIONS:-}"
      SESSION_DATABASE_URL: "${SESSION_DATABASE_URL:-sqlite:////data/kchat-sessions.db}"
      SPARQL_ENDPOINT: "/rdf"
      RATE_LIMIT_QUESTIONS: "${RATE_LIMIT_QUESTIONS:-}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-3600}"

volumes:
  kchat-sessions:
